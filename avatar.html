<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cartly Avatar Builder</title>

  <link rel="stylesheet" href="avatar.css">

  <!-- Download Avatar -->
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

</head>

<body>

<!-- 🔥 Gender Selection -->

<div class="gender-screen" id="genderScreen">

  <h1>Choose Your Avatar</h1>

  <div class="gender-buttons">

    <button onclick="selectGender('girl')">
      👧 Girl
    </button>

    <button onclick="selectGender('boy')">
      👦 Boy
    </button>

  </div>

</div>

<!-- 🔥 Main App -->

<div class="app">

  <!-- Sidebar -->

  <div class="sidebar">

    <h2>🛒 Cartly Avatar</h2>

    <button onclick="changeHair()">
      💇 Change Hair
    </button>

    <button onclick="changeDress()">
      👗 Change Dress
    </button>

    <button onclick="changeSkin()">
      ✨ Skin Tone
    </button>

    <button onclick="changeEarrings()">
      💎 Earrings
    </button>

    <button onclick="changeRing()">
      💍 Ring
    </button>

  </div>

  <!-- Main -->

  <div class="main">

    <div class="avatar" id="avatar">

      <!-- Hair -->

      <div class="hair" id="hair"></div>

      <!-- Face -->

      <div class="face" id="face"></div>

      <!-- Earrings -->

      <div class="earring left-earring" id="leftEarring"></div>
      <div class="earring right-earring" id="rightEarring"></div>

      <!-- Eyebrows -->

      <div class="eyebrow left-brow"></div>
      <div class="eyebrow right-brow"></div>

      <!-- Eyes -->

      <div class="eye left"></div>
      <div class="eye right"></div>

      <!-- Mouth -->

      <div class="mouth"></div>

      <!-- Body -->

      <div class="body" id="body"></div>

      <!-- Ring -->

      <div class="ring" id="ring"></div>

    </div>

    <!-- Buttons -->

    <div class="actions">

      <button onclick="saveAvatar()">
        Save Avatar
      </button>

      <button onclick="downloadAvatar()">
        Download
      </button>

    </div>

  </div>

</div>

<script src="avatar.js"></script>

</body>
</html>
